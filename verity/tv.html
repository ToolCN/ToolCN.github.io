<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verity - Ventana</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; }
  video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
  #fondo-tv { z-index: 1; }
  #efecto-tv {
    z-index: 2;
    opacity: 0;
    transition: opacity 0.2s;
    mix-blend-mode: screen;
  }
  #cinematica-tv {
    z-index: 3;
    opacity: 0;
    transition: opacity 0.2s;
    background: #000;
  }
  #btnIniciar {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 24px 48px;
    font-size: 1.5rem;
    border-radius: 12px;
    border: none;
    background: #444;
    color: white;
    z-index: 10;
  }
</style>
</head>
<body>

<button id="btnIniciar">Toca para iniciar</button>

<video id="fondo-tv" playsinline loop></video>
<video id="efecto-tv" playsinline></video>
<video id="cinematica-tv" playsinline></video>
<audio id="musica-tv" loop></audio>

<script src="polling.js"></script>
<script>
  const boton = document.getElementById('btnIniciar');
  const fondo = document.getElementById('fondo-tv');
  const efecto = document.getElementById('efecto-tv');
  const cinematica = document.getElementById('cinematica-tv');
  const musica = document.getElementById('musica-tv');

  const FONDO_DIA = "videos/dia.mp4";

  // Fondos que cambian y se quedan en loop
  const EVENTOS_INICIO_NOCHE_FONDO = {
    "acto1_inicio": "videos/fondo-noche1.mp4",
    "acto2_inicio": "videos/fondo-noche1.mp4",
    "acto3_inicio": "videos/fondo-noche1.mp4",
    "acto3_pila_obtenida": "videos/verity-observando.mp4",
    "acto3_arma_lista": "videos/verity-atacando.mp4",
    "noche4_top_secret": "videos/continuara.mp4"
  };

  // Fondos de "una vez" que al terminar regresan solos a dia.mp4
  const EVENTOS_CIERRE_NOCHE_FONDO = {
    "acto1_cierre": "videos/amanecer-noche1.mp4",
    "acto2_cierre": "videos/amanecer-noche1.mp4",
    "acto3_disparo_arma": "videos/verity-destruida.mp4"
  };

  const EVENTOS_EFECTO = {
    "acto1_trivia_correcto":   "efectos/acto1_trivia_correcto.mp4",
    "acto1_trivia_incorrecto": "efectos/acto1_trivia_incorrecto.mp4",
    "acto1_pista_uv":          "efectos/acto1_pista_uv.mp4"
  };

  const EVENTOS_CINEMATICA = [
    "acto3_transformacion",
    "acto3_reto_final_exito"
  ];

  function iniciarNocheFondo(ruta) {
    fondo.loop = true;
    fondo.src = ruta;
    fondo.play().catch(() => {});
  }

  function iniciarAmanecer(ruta) {
    fondo.loop = false;
    fondo.src = ruta;
    fondo.play().catch(() => {});
    musica.pause();
    musica.currentTime = 0;
  }

  function volverADia() {
    fondo.loop = true;
    fondo.src = FONDO_DIA;
    fondo.play().catch(() => {});
  }

  fondo.addEventListener('ended', () => {
    if (!fondo.loop) volverADia();
  });

  boton.addEventListener('click', () => {
    volverADia();
    boton.style.display = 'none';

    iniciarSondeo((evento) => {
      if (evento === 'reiniciar_todo') {
        efecto.style.opacity = '0';
        cinematica.style.opacity = '0';
        musica.pause();
        musica.currentTime = 0;
        volverADia();
        return;
      }

      if (EVENTOS_INICIO_NOCHE_FONDO[evento]) {
        iniciarNocheFondo(EVENTOS_INICIO_NOCHE_FONDO[evento]);
      } else if (EVENTOS_CIERRE_NOCHE_FONDO[evento]) {
        iniciarAmanecer(EVENTOS_CIERRE_NOCHE_FONDO[evento]);
      } else if (EVENTOS_CINEMATICA.includes(evento)) {
        reproducirCinematica(evento);
      } else if (EVENTOS_EFECTO[evento]) {
        reproducirEfecto(EVENTOS_EFECTO[evento]);
      }
    });
  });

  function reproducirEfecto(ruta) {
    efecto.src = ruta;
    efecto.currentTime = 0;
    efecto.style.opacity = '1';
    efecto.play().catch(() => {});
  }

  efecto.addEventListener('ended', () => {
    efecto.style.opacity = '0';
  });

  function reproducirCinematica(evento) {
    cinematica.src = `videos/${evento}.mp4`;
    cinematica.currentTime = 0;
    cinematica.style.opacity = '1';
    cinematica.play().catch(() => {});
  }

  cinematica.addEventListener('ended', () => {
    cinematica.style.opacity = '0';
  });
</script>
</body>
</html>
