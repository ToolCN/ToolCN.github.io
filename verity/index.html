<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Caja de Verity</title>
<style>
  body {
    background: #0a0a0a;
    background-size: cover;
    background-position: center;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
  }
  #contenedor { max-width: 480px; text-align: center; }
  #contenedor.mapa-contenedor { max-width: 900px; }

  .panel {
    background: rgba(0, 0, 0, 0.55);
    padding: 24px;
    border-radius: 16px;
    animation: apareceSuave 0.4s ease;
  }
  h1 { font-size: 1.4rem; margin-bottom: 16px; }
  p { font-size: 1.05rem; line-height: 1.5; color: #ddd; margin-bottom: 28px; }
  .botones { display: flex; flex-direction: column; gap: 12px; }
  button {
    padding: 16px;
    font-size: 1rem;
    border-radius: 10px;
    border: none;
    background: #333;
    color: white;
  }
  button:active { background: #555; }
  .botones button:disabled { opacity: 0.4; cursor: not-allowed; }

  @keyframes apareceSuave {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  #btn-reiniciar {
    position: fixed; top: 12px; right: 12px; z-index: 60;
    padding: 8px 12px; font-size: 0.75rem; border-radius: 8px;
    border: 1px solid #444; background: rgba(0,0,0,0.5); color: #ccc;
  }

  #flash {
    position: fixed; inset: 0; background: #fff; opacity: 0;
    transition: opacity 0.25s; pointer-events: none; z-index: 200;
  }

  #verity-esquina {
    position: fixed; bottom: 14px; right: 14px; width: 84px; height: 84px;
    border-radius: 50%; object-fit: cover; box-shadow: 0 0 14px rgba(0,0,0,.7);
    z-index: 50; display: none;
  }

  #popup-verity {
    position: fixed; inset: 0; background: rgba(0,0,0,.88);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  #popup-verity.activo { opacity: 1; }
  #popup-verity img { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; }

  .mapa-noches {
    display: flex; flex-direction: row; flex-wrap: wrap;
    gap: 32px; justify-content: flex-start; padding: 10px;
  }
  .noche-nodo {
    width: 180px; height: 180px; border-radius: 50%;
    background: #2a2a2a; border: 3px solid #4a4a6a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; cursor: pointer; position: relative;
  }
  .noche-nodo .emoji { font-size: 2.2rem; margin-bottom: 6px; }
  .noche-nodo .etiqueta { font-size: 1rem; }
  .noche-nodo:active { background: #444; }
  .noche-nodo.completada { background: #1a1a1a; border-color: #333; cursor: default; opacity: 0.5; }

  .badge-superado {
    position: absolute; top: -12px; right: -12px; background: #2e7d32; color: #fff;
    border-radius: 50%; width: 38px; height: 38px; display: flex;
    align-items: center; justify-content: center; font-size: 1.1rem; opacity: 1;
  }
  .badge-superado.recien { animation: apareceBadge 0.8s ease-out; }

  @keyframes apareceBadge {
    0%   { opacity: 0; transform: scale(0.3); }
    60%  { opacity: 1; transform: scale(1.25); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes crecerDesvanecido {
    0%   { opacity: 0;    transform: scale(0.25); filter: blur(8px); }
    20%  { opacity: 0.2;  transform: scale(0.4);  filter: blur(7px); }
    40%  { opacity: 0.45; transform: scale(0.65); filter: blur(5px); }
    60%  { opacity: 0.7;  transform: scale(0.85); filter: blur(3px); }
    80%  { opacity: 0.9;  transform: scale(1.05); filter: blur(1px); }
    92%  { opacity: 1;    transform: scale(0.97); filter: blur(0); }
    100% { opacity: 1;    transform: scale(1); }
  }
  .noche-nodo.aparece-nueva { animation: crecerDesvanecido 3.2s ease-out; }

  .resumen-trivia { font-size: 1.3rem; letter-spacing: 6px; margin-bottom: 14px; }

  #marco-respuesta {
    position: fixed; inset: 0; border: 16px solid transparent;
    z-index: 90; pointer-events: none; opacity: 0;
  }
  #marco-respuesta.correcta { border-color: #2ecc71; animation: parpadeoMarco 1.4s ease-in-out; }
  #marco-respuesta.incorrecta { border-color: #e74c3c; animation: parpadeoMarco 1.4s ease-in-out; }
  @keyframes parpadeoMarco {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    25%  { opacity: 0.25; }
    40%  { opacity: 1; }
    55%  { opacity: 0.25; }
    70%  { opacity: 1; }
    100% { opacity: 0; }
  }

  #emoji-respuesta {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 6rem; z-index: 95; pointer-events: none; opacity: 0;
  }
  #emoji-respuesta.mostrar { animation: emojiRespuesta 1.4s ease-out; }
  @keyframes emojiRespuesta {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0; }
    30%  { transform: translate(-50%, -50%) scale(1.6); opacity: 1; }
    55%  { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
  }

  .input-clave {
    padding: 12px; font-size: 1.1rem; border-radius: 8px;
    border: 2px solid #555; background: #1a1a1a; color: #fff;
    width: 80%; text-align: center; text-transform: uppercase; letter-spacing: 2px;
  }
  .clave-error { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; display: none; }
  .imagen-objeto { width: 140px; height: 140px; object-fit: contain; margin: 12px 0; }

  /* --- Tala de árboles: grandes, aleatorios, toda la pantalla --- */
  .panel-tala {
    position: relative;
    z-index: 10;
    background: rgba(0, 0, 0, 0.55);
    padding: 20px;
    border-radius: 16px;
    max-width: 420px;
    margin: 0 auto;
    text-align: center;
  }
  .bosque-pantalla {
    position: fixed;
    inset: 0;
    z-index: 5;
  }
  .arbol {
    position: absolute;
    font-size: 5.6rem;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s;
    transform: translate(-50%, -50%);
  }
  .arbol:active { transform: translate(-50%, -50%) scale(0.85); }
  .arbol.talado { opacity: 0.4; cursor: default; }

  .barda { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
  .barda span {
    font-size: 2.2rem; display: inline-block; opacity: 0;
    animation: apareceTronco 0.5s ease-out forwards;
  }
  @keyframes apareceTronco {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<button id="btn-reiniciar" onclick="reiniciarJuego()">↺ Reiniciar</button>
<div id="flash"></div>
<div id="marco-respuesta"></div>
<div id="emoji-respuesta"></div>
<img id="verity-esquina" src="" alt="Verity">
<audio id="musica-fondo" loop></audio>
<div id="popup-verity">
  <img id="popup-verity-img" src="" alt="Verity activa">
</div>

<div id="contenedor"></div>

<script>
// =========================================================
// CONFIGURACIÓN
// =========================================================
const TABLERO_URL = "https://script.google.com/macros/s/AKfycbyQHFmrZeorHSBa-1D9hoDPPosxMsH_vqaCPl6SyUvRXlUpR42xFr07vDZSFIkfIfwS/exec";
const CLAVE = "bruno2026";
const CLAVE_SECRETA_NOCHE1 = "BOSQUE";

// =========================================================
// Estado general
// =========================================================
let estadoNoches = { 1: 'bloqueada', 2: 'bloqueada', 3: 'bloqueada' };
let nocheEntrandoPendiente = null;
let nocheSuperadaPendiente = null;
let nocheActual = null;
let alCerrarPopupActual = null;
let cancelarEsperaActual = null;
let resultadosTrivia = [];
let procesandoRespuestaTrivia = false;

const EVENTOS_INICIO_NOCHE = { 1: 'acto1_inicio', 2: 'acto2_inicio', 3: 'acto3_inicio' };
const PANTALLA_INICIO_NOCHE = { 1: 'acto1_inicio', 2: 'acto2_inicio', 3: 'acto3_inicio' };
const ESPERA_MAXIMA_MS = 20000;

async function enviarEvento(nombreEvento) {
  if (!nombreEvento) return;
  try {
    await fetch(`${TABLERO_URL}?clave=${CLAVE}`, {
      method: "POST",
      body: JSON.stringify({ evento: nombreEvento })
    });
    console.log("Evento enviado:", nombreEvento);
  } catch (error) {
    console.error("No se pudo enviar el evento:", error);
  }
}

function reproducirSonidoLocal(nombreArchivo) {
  const audio = new Audio(`sonidos/${nombreArchivo}`);
  audio.play().catch(err => console.error("No se pudo reproducir sonido local:", err));
}

function iniciarMusicaFondo() {
  const musica = document.getElementById('musica-fondo');
  musica.src = 'sonidos/musica_fondo.mp3';
  musica.volume = 0.15;
  musica.play().catch(err => console.error("No se pudo iniciar la música:", err));
}

const contenedor = document.getElementById('contenedor');

// =========================================================
// Espera genérica de "audio terminado"
// =========================================================
function esperarFinDeAudio(eventoEsperado, alTerminar) {
  let yaTermino = false;
  const tiempoInicioEspera = new Date().getTime();

  const intervalo = setInterval(async () => {
    if (yaTermino) return;
    try {
      const resp = await fetch(`${TABLERO_URL}?clave=${CLAVE}`);
      const datos = await resp.json();
      if (datos.audioTerminado === eventoEsperado && datos.audioTerminadoTs >= tiempoInicioEspera) {
        terminar();
      }
    } catch (err) {
      console.error("Error esperando fin de audio:", err);
    }
  }, 500);

  const limiteSeguridad = setTimeout(terminar, ESPERA_MAXIMA_MS);

  function terminar() {
    if (yaTermino) return;
    yaTermino = true;
    clearInterval(intervalo);
    clearTimeout(limiteSeguridad);
    alTerminar();
  }

  return terminar;
}

// =========================================================
// Reiniciar
// =========================================================
function reiniciarJuego() {
  if (!confirm('¿Reiniciar toda la aventura desde el principio?')) return;

  enviarEvento('reiniciar_todo');

  estadoNoches = { 1: 'bloqueada', 2: 'bloqueada', 3: 'bloqueada' };
  nocheEntrandoPendiente = null;
  nocheSuperadaPendiente = null;
  resultadosTrivia = [];
  procesandoRespuestaTrivia = false;

  document.getElementById('verity-esquina').style.display = 'none';
  document.body.style.backgroundImage = 'none';
  contenedor.classList.remove('mapa-contenedor');

  mostrarCaja();
}

// =========================================================
// PANTALLA 1 — La caja
// =========================================================
function mostrarCaja() {
  contenedor.classList.remove('mapa-contenedor');
  document.body.style.backgroundImage = "url('imagenes/fondo-caja.png')";
  contenedor.innerHTML = `
    <div class="panel">
      <h1>La Caja Misteriosa</h1>
      <p>Encontraste una caja extraña frente a la puerta. Parece que dentro se escuchan sonidos raros.</p>
      <div class="botones"><button onclick="abrirCaja()">Abrir la caja</button></div>
    </div>
  `;
}

function abrirCaja() {
  reproducirSonidoLocal('caja_abierta.mp3');
  iniciarMusicaFondo();
  const flash = document.getElementById('flash');
  flash.style.opacity = '1';

  setTimeout(() => {
    flash.style.opacity = '0';
    document.getElementById('popup-verity-img').src = 'imagenes/verity-noche1.png';

    mostrarPopupVerity('caja_abierta', () => {
      // Primera vez: no hay noche previa que "superar", solo
      // aparece Noche 1 con su propio sonido.
      document.body.style.backgroundImage = "url('imagenes/fondo-mapa.png')";
      contenedor.classList.add('mapa-contenedor');
      contenedor.innerHTML = `<div class="mapa-noches"></div>`;

      setTimeout(() => {
        estadoNoches[1] = 'activa';
        reproducirSonidoLocal('noche_nueva.mp3');
        dibujarMapa({ nocheNueva: 1 });
      }, 400);
    });
  }, 300);
}

// =========================================================
// PANTALLA 2 — El mapa
// =========================================================
function mostrarMapa() {
  document.body.style.backgroundImage = "url('imagenes/fondo-mapa.png')";
  dibujarMapa({ nocheSuperada: nocheSuperadaPendiente });

  if (nocheSuperadaPendiente) {
    reproducirSonidoLocal('noche_completada.mp3');
  }

  if (nocheEntrandoPendiente) {
    const entrante = nocheEntrandoPendiente;
    nocheSuperadaPendiente = null;
    nocheEntrandoPendiente = null;
    setTimeout(() => {
      estadoNoches[entrante] = 'activa';
      reproducirSonidoLocal('noche_nueva.mp3');
      dibujarMapa({ nocheNueva: entrante });
    }, 1300);
  } else {
    nocheSuperadaPendiente = null;
  }
}

function dibujarMapa({ nocheNueva = null, nocheSuperada = null } = {}) {
  contenedor.classList.add('mapa-contenedor');
  let html = '';
  for (let n = 1; n <= 3; n++) {
    const estado = estadoNoches[n];
    if (estado === 'bloqueada') continue;
    const clases = ['noche-nodo'];
    if (estado === 'completada') clases.push('completada');
    if (n === nocheNueva) clases.push('aparece-nueva');
    const clickable = estado === 'activa';
    const badgeRecien = (estado === 'completada' && n === nocheSuperada) ? ' recien' : '';
    html += `
      <div class="${clases.join(' ')}" ${clickable ? `onclick="iniciarNoche(${n})"` : ''}>
        <span class="emoji">🌙☁️</span>
        <span class="etiqueta">Noche ${n}</span>
        ${estado === 'completada' ? `<span class="badge-superado${badgeRecien}">✅</span>` : ''}
      </div>
    `;
  }
  contenedor.innerHTML = `<div class="mapa-noches">${html}</div>`;
}

function completarNocheYDesbloquear(nTerminada, nSiguiente) {
  estadoNoches[nTerminada] = 'completada';
  nocheSuperadaPendiente = nTerminada;
  nocheEntrandoPendiente = nSiguiente;
}

// =========================================================
// Popup de Verity — se cierra SOLO cuando el celular avisa que
// terminó el audio (o por el límite de seguridad). Ya no se
// puede saltar tocando la pantalla, para garantizar la sincronía.
// =========================================================
function mostrarPopupVerity(evento, alCerrar) {
  document.getElementById('popup-verity').classList.add('activo');
  enviarEvento(evento);
  alCerrarPopupActual = alCerrar;
  cancelarEsperaActual = esperarFinDeAudio(evento, cerrarPopupVerity);
}

function cerrarPopupVerity() {
  document.getElementById('popup-verity').classList.remove('activo');
  cancelarEsperaActual = null;
  const callback = alCerrarPopupActual;
  alCerrarPopupActual = null;
  if (callback) callback();
}

function iniciarNoche(n) {
  nocheActual = n;
  document.getElementById('popup-verity-img').src = `imagenes/verity-noche${n}.png`;
  document.getElementById('verity-esquina').src = `imagenes/verity-noche${n}.png`;
  document.getElementById('verity-esquina').style.display = 'block';

  mostrarPopupVerity(EVENTOS_INICIO_NOCHE[n], () => {
    document.body.style.backgroundImage = 'none';
    contenedor.classList.remove('mapa-contenedor');
    mostrarPantalla(PANTALLA_INICIO_NOCHE[n], { saltarEventoAuto: true });
  });
}

// =========================================================
// PANTALLAS — contenido de cada noche
// =========================================================
const PANTALLAS = {

  acto1_inicio: {
    titulo: "Noche 1 — Conociendo a Verity",
    texto: "Verity quiere conocerte mejor antes de seguir.",
    eventoAuto: "acto1_inicio",
    botones: [{ texto: "Comenzar", siguiente: "acto1_trivia" }]
  },

  acto1_uv: {
    titulo: "Un secreto que pocos ven",
    texto: 'Verity: "Ya te conozco un poco mejor, Bruno. Ahora yo también quiero enseñarte algo que casi nadie puede ver." Busca la lámpara UV que tienes preparada y recorre la casa con ella — hay una nota escondida que solo se revela con esa luz.',
    botones: [{ texto: "Ya encontré la nota", siguiente: "acto1_clave" }]
  },

  acto1_cierre: {
    titulo: "Fin de la Noche 1",
    texto: "Verity dice algo que no debería saber sobre ti...",
    eventoAuto: "acto1_cierre",
    botones: [{ texto: "Continuar", completaNoche: 1, siguienteNoche: 2, siguiente: "mapa" }]
  },

  acto2_inicio: {
    titulo: "Noche 2 — Las grietas",
    texto: "Algo en la casa se siente diferente hoy.",
    eventoAuto: "acto2_inicio",
    botones: [{ texto: "Buscar qué cambió", siguiente: "acto2_inconsistencia" }]
  },

  acto2_inconsistencia: {
    titulo: "¿Qué cambió?",
    texto: "[PLACEHOLDER: aquí va el reto de comparar fotos/objetos]",
    botones: [
      { texto: "La encontré", evento: "acto2_inconsistencia_hallada", siguiente: "acto2_mentira" },
      { texto: "No la encuentro (intentar de nuevo)", evento: "acto2_inconsistencia_fallada", siguiente: "acto2_inconsistencia" }
    ]
  },

  acto2_mentira: {
    titulo: "El detector de mentiras",
    texto: "[PLACEHOLDER: aquí va el reto físico con el probador de continuidad]",
    botones: [{ texto: "Detecté la mentira", evento: "acto2_mentira_detectada", siguiente: "acto2_cierre" }]
  },

  acto2_cierre: {
    titulo: "Fin de la Noche 2",
    texto: "Mañana es la última noche. Verity suena distinta al despedirse.",
    eventoAuto: "acto2_cierre",
    botones: [{ texto: "Continuar", completaNoche: 2, siguienteNoche: 3, siguiente: "mapa" }]
  },

  acto3_inicio: {
    titulo: "Noche 3 — La Transformación",
    texto: "Es esta noche. Verity ya no puede detenerlo.",
    eventoAuto: "acto3_inicio",
    botones: [{ texto: "Comenzar", siguiente: "acto3_cuenta" }]
  },

  acto3_cuenta: {
    titulo: "Cuenta regresiva",
    texto: "El tiempo corre. Algo se acerca a la ventana.",
    eventoAuto: "acto3_cuenta_regresiva_inicio",
    botones: [{ texto: "Algo está pasando...", siguiente: "acto3_transformacion" }]
  },

  acto3_transformacion: {
    titulo: "ALGO QUIERE ENTRAR",
    texto: "Verity ya no suena como Verity.",
    eventoAuto: "acto3_transformacion",
    botones: [{ texto: "Buscar piezas para el arma", siguiente: "acto3_arma" }]
  },

  acto3_arma: {
    titulo: "Construye tu arma",
    texto: "[PLACEHOLDER: aquí va el checklist del reto físico de armar]",
    eventoAuto: "acto3_construir_arma",
    botones: [{ texto: "Ya terminé mi arma", evento: "acto3_arma_lista", siguiente: "acto3_final_reto" }]
  },

  acto3_final_reto: {
    titulo: "El enfrentamiento",
    texto: "[PLACEHOLDER: aquí va el minijuego final de la batalla]",
    botones: [{ texto: "¡Atacar!", evento: "acto3_reto_final_exito", siguiente: "acto3_resolucion" }]
  },

  acto3_resolucion: {
    titulo: "¿Bruno? ¿Sigues ahí?",
    texto: "La ventana vuelve a la calma. La tormenta se aleja.",
    eventoAuto: "acto3_resolucion",
    botones: [{ texto: "Continuar", siguiente: "acto3_final" }]
  },

  acto3_final: {
    titulo: "Fin del Capítulo 1",
    texto: "Todo está bien ahora, Bruno. De verdad... ¿o eso creemos? 👀",
    eventoAuto: "acto3_final",
    botones: []
  }

};

// =========================================================
// TRIVIA
// =========================================================
const PREGUNTAS_TRIVIA = [
  { pregunta: "¿Cuántos días tiene una semana?", opciones: ["5", "7", "10"], correcta: 1 },
  { pregunta: '¿Qué animal dice "muu"?', opciones: ["Perro", "Vaca", "Gato"], correcta: 1 },
  { pregunta: "¿De qué color es el pasto?", opciones: ["Azul", "Verde", "Morado"], correcta: 1 },
  { pregunta: "¿Cuántos dedos tienes en una mano?", opciones: ["4", "5", "6"], correcta: 1 },
  { pregunta: "¿Qué les gusta comer a los conejos?", opciones: ["Carne", "Zanahorias", "Piedras"], correcta: 1 },
  { pregunta: "¿En qué estación hace más frío?", opciones: ["Verano", "Invierno", "Primavera"], correcta: 1 }
];

function iniciarTrivia() {
  resultadosTrivia = [];
  procesandoRespuestaTrivia = false;
  contenedor.innerHTML = `<div class="panel"><p>Verity está preparando sus preguntas...</p></div>`;
  setTimeout(() => mostrarTrivia(0), 1400);
}

function mostrarTrivia(indice) {
  if (indice >= PREGUNTAS_TRIVIA.length) {
    mostrarPopupVerity('acto1_pista_uv', () => {
      document.body.style.backgroundImage = 'none';
      mostrarPantalla('acto1_uv', { saltarEventoAuto: true });
    });
    return;
  }

  const q = PREGUNTAS_TRIVIA[indice];
  const resumen = PREGUNTAS_TRIVIA.map((_, i) => {
    if (resultadosTrivia[i] === 'correcta') return '✅';
    if (resultadosTrivia[i] === 'incorrecta') return '❌';
    return '⚪';
  }).join(' ');

  contenedor.innerHTML = `
    <div class="panel">
      <div class="resumen-trivia">${resumen}</div>
      <h1>Trivia de Verity (${indice + 1}/${PREGUNTAS_TRIVIA.length})</h1>
      <p>${q.pregunta}</p>
      <div class="botones">
        ${q.opciones.map((op, i) => `<button onclick="responderTrivia(${indice}, ${i})">${op}</button>`).join('')}
      </div>
    </div>
  `;
}

function mostrarEfectoRespuesta(esCorrecta) {
  const marco = document.getElementById('marco-respuesta');
  const emoji = document.getElementById('emoji-respuesta');

  marco.className = '';
  emoji.className = '';
  void marco.offsetWidth;
  void emoji.offsetWidth;

  marco.classList.add(esCorrecta ? 'correcta' : 'incorrecta');
  emoji.textContent = esCorrecta ? '✅' : '❌';
  emoji.classList.add('mostrar');

  reproducirSonidoLocal(esCorrecta ? 'acto1_trivia_correcto.mp3' : 'acto1_trivia_incorrecto.mp3');
}

function responderTrivia(indicePregunta, indiceOpcion) {
  if (procesandoRespuestaTrivia) return;
  procesandoRespuestaTrivia = true;

  const q = PREGUNTAS_TRIVIA[indicePregunta];
  const esCorrecta = indiceOpcion === q.correcta;
  resultadosTrivia[indicePregunta] = esCorrecta ? 'correcta' : 'incorrecta';

  const nombreEvento = esCorrecta ? "acto1_trivia_correcto" : "acto1_trivia_incorrecto";
  enviarEvento(nombreEvento);
  mostrarEfectoRespuesta(esCorrecta);

  esperarFinDeAudio(nombreEvento, () => {
    procesandoRespuestaTrivia = false;
    mostrarTrivia(indicePregunta + 1);
  });
}

// =========================================================
// Tala de árboles — grandes, aleatorios, toda la pantalla
// =========================================================
const TOTAL_ARBOLES = 8;
const GOLPES_POR_ARBOL = 3;
const MADERA_OBJETIVO = 5;

let estadoArboles = [];
let posicionesArboles = [];
let maderaRecolectada = 0;

function iniciarTala() {
  estadoArboles = Array(TOTAL_ARBOLES).fill(0);
  maderaRecolectada = 0;
  posicionesArboles = Array.from({ length: TOTAL_ARBOLES }, () => ({
    top: 12 + Math.random() * 70,
    left: 8 + Math.random() * 84
  }));
  dibujarTala();
}

function dibujarTala() {
  contenedor.classList.remove('mapa-contenedor');
  let arbolesHtml = '';
  for (let i = 0; i < TOTAL_ARBOLES; i++) {
    const talado = estadoArboles[i] >= GOLPES_POR_ARBOL;
    const pos = posicionesArboles[i];
    arbolesHtml += `<span class="arbol ${talado ? 'talado' : ''}" style="top:${pos.top}%; left:${pos.left}%;" onclick="golpearArbol(${i})">${talado ? '🪵' : '🌳'}</span>`;
  }
  contenedor.innerHTML = `
    <div class="panel-tala">
      <h1>Construye tu barda</h1>
      <p>Toca los árboles varias veces para talarlos. Necesitas ${MADERA_OBJETIVO} troncos de madera.</p>
      <p style="font-size:1.2rem; margin:0;">🪵 Madera: ${maderaRecolectada} / ${MADERA_OBJETIVO}</p>
    </div>
    <div class="bosque-pantalla">${arbolesHtml}</div>
  `;
}

function golpearArbol(indice) {
  if (estadoArboles[indice] >= GOLPES_POR_ARBOL) return;
  if (maderaRecolectada >= MADERA_OBJETIVO) return;

  reproducirSonidoLocal('tala_golpe.mp3');
  estadoArboles[indice]++;
  if (estadoArboles[indice] >= GOLPES_POR_ARBOL) {
    maderaRecolectada++;
  }

  if (maderaRecolectada >= MADERA_OBJETIVO) {
    setTimeout(() => mostrarPantalla('acto1_barda'), 500);
  } else {
    dibujarTala();
  }
}

// =========================================================
// Construcción de la barda
// =========================================================
function mostrarBarda() {
  reproducirSonidoLocal('barda_construccion.mp3');
  contenedor.classList.remove('mapa-contenedor');
  contenedor.innerHTML = `
    <div class="panel">
      <h1>Construyendo la barda</h1>
      <p>Con la madera que recolectaste, Verity te ayuda a levantar una barda alrededor de la casa.</p>
      <div class="barda">
        <span style="animation-delay:0s">🪵</span>
        <span style="animation-delay:0.3s">🪵</span>
        <span style="animation-delay:0.6s">🪵</span>
        <span style="animation-delay:0.9s">🪵</span>
        <span style="animation-delay:1.2s">🪵</span>
      </div>
      <div class="botones" id="botones-barda" style="opacity:0; transition: opacity 0.5s;">
        <button onclick="mostrarPantalla('acto1_cierre')">Continuar</button>
      </div>
    </div>
  `;
  setTimeout(() => {
    document.getElementById('botones-barda').style.opacity = '1';
  }, 1800);
}

// =========================================================
// Motor de navegación general
// =========================================================
function mostrarPantalla(id, opciones = {}) {
  if (id === 'acto1_trivia') { iniciarTrivia(); return; }
  if (id === 'acto1_hacha') { mostrarHacha(); return; }
  if (id === 'acto1_clave') { mostrarClave(); return; }
  if (id === 'acto1_tala') { iniciarTala(); return; }
  if (id === 'acto1_barda') { mostrarBarda(); return; }

  contenedor.classList.remove('mapa-contenedor');
  document.body.style.backgroundImage = 'none';

  const p = PANTALLAS[id];
  const debeEsperarAudio = !!(p.eventoAuto && !opciones.saltarEventoAuto);

  contenedor.innerHTML = `
    <div class="panel">
      <h1>${p.titulo}</h1>
      <p>${p.texto}</p>
      <div class="botones">
        ${p.botones.map((b, i) => `<button onclick="clicBoton('${id}', ${i})" ${debeEsperarAudio ? 'disabled' : ''}>${b.texto}</button>`).join('')}
      </div>
    </div>
  `;

  if (debeEsperarAudio) {
    enviarEvento(p.eventoAuto);
    esperarFinDeAudio(p.eventoAuto, habilitarBotones);
  }
}

function habilitarBotones() {
  document.querySelectorAll('#contenedor .botones button').forEach(b => b.disabled = false);
}

function clicBoton(idPantallaActual, indiceBoton) {
  const boton = PANTALLAS[idPantallaActual].botones[indiceBoton];
  if (boton.evento) enviarEvento(boton.evento);
  if (boton.completaNoche) completarNocheYDesbloquear(boton.completaNoche, boton.siguienteNoche);
  irA(boton.siguiente);
}

function irA(destino) {
  if (destino === 'mapa') { mostrarMapa(); return; }
  mostrarPantalla(destino);
}
