<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verity - Voz</title>
<style>
  body {
    background: #000;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    gap: 16px;
  }
  button {
    padding: 24px 48px;
    font-size: 1.3rem;
    border-radius: 12px;
    border: none;
    background: #444;
    color: white;
  }
  #btn-disparo {
    display: none;
    position: fixed;
    bottom: 20px;
    padding: 26px 44px;
    font-size: 1.4rem;
    background: #6a1a1a;
    border-radius: 16px;
  }
  #btn-disparo.visible { display: block; }
  .soundboard {
    display: none;
    flex-direction: column;
    gap: 10px;
    width: 90%;
    max-width: 360px;
    margin-bottom: 80px;
  }
  .soundboard.visible { display: flex; }
  .soundboard button {
    padding: 14px 20px;
    font-size: 1rem;
    background: #1a3a5c;
    border-radius: 10px;
  }
  #estado {
    position: fixed;
    bottom: 80px;
    font-size: 0.8rem;
    color: #555;
  }
</style>
</head>
<body>

<button id="btnIniciar">Toca para iniciar (conecta primero la bocina bluetooth)</button>
<audio id="reproductor"></audio>
<audio id="loop-persecucion" loop></audio>
<audio id="cancion-fondo" loop></audio>
<div id="estado">esperando...</div>
<div id="soundboard-guia" class="soundboard">
  <button onclick="reproducirFraseGuia('acto1_guia_llevame')">🎒 Llévame contigo</button>
  <button onclick="reproducirFraseGuia('acto1_guia_comenzar')">🔍 Comencemos</button>
  <button onclick="reproducirFraseGuia('acto1_guia_derecho')">⬆️ Sigue derecho</button>
  <button onclick="reproducirFraseGuia('acto1_guia_izquierda')">⬅️ Izquierda</button>
  <button onclick="reproducirFraseGuia('acto1_guia_derecha')">➡️ Derecha</button>
  <button onclick="reproducirFraseGuia('acto1_guia_atras')">↩️ Te pasaste</button>
  <button onclick="reproducirFraseGuia('acto1_guia_bano')">🚽 Baño</button>
  <button onclick="reproducirFraseGuia('acto1_guia_gas')">💨 Gas</button>
  <button onclick="reproducirFraseGuia('acto1_guia_ya_no_bano')">😅 Ya no</button>
  <button onclick="reproducirFraseGuia('acto1_guia_regresa')">📱 Regresa a la tablet</button>
</div>
<button id="btn-disparo" onclick="dispararArma()">🔫 Bruno disparó</button>

<script src="polling.js"></script>
<script>
  const boton = document.getElementById('btnIniciar');
  const audio = document.getElementById('reproductor');
  const loopPersecucion = document.getElementById('loop-persecucion');
  const cancionFondo = document.getElementById('cancion-fondo');
  const estado = document.getElementById('estado');

  // Ajusta esto a la duración real de videos/verity-destruida.mp4
  const DURACION_VIDEO_DESTRUIDA_MS = 10000;

  let ultimoEventoReproducido = null;

  audio.addEventListener('ended', () => {
    if (!ultimoEventoReproducido) return;
    fetch(`${TABLERO_URL}?clave=${CLAVE}`, {
      method: "POST",
      body: JSON.stringify({ tipo: 'audio_terminado', evento: ultimoEventoReproducido })
    }).catch(err => console.error("No se pudo avisar fin de audio:", err));
  });

  function reproducirFraseGuia(nombreArchivo) {
    const audioGuia = new Audio(`audios/${nombreArchivo}.mp3`);
    audioGuia.play().catch(err => console.error("No se pudo reproducir:", err));

    if (nombreArchivo === 'acto1_guia_regresa') {
      fetch(`${TABLERO_URL}?clave=${CLAVE}`, {
        method: "POST",
        body: JSON.stringify({ evento: 'acto1_guia_regresa' })
      }).catch(err => console.error("No se pudo avisar a la tablet:", err));
    }
  }

  function dispararArma() {
    fetch(`${TABLERO_URL}?clave=${CLAVE}`, {
      method: "POST",
      body: JSON.stringify({ evento: 'acto3_disparo_arma' })
    }).catch(err => console.error("No se pudo enviar la señal:", err));
  }

  boton.addEventListener('click', () => {
    audio.src = "audios/silencio.mp3";
    audio.play().catch(() => {});

    boton.style.display = 'none';
    estado.textContent = 'conectado, esperando eventos...';

    iniciarSondeo((evento) => {
      if (evento === 'reiniciar_todo') {
        ultimoEventoReproducido = null;
        audio.src = "audios/silencio.mp3";
        audio.play().catch(() => {});
        loopPersecucion.pause();
        loopPersecucion.currentTime = 0;
        cancionFondo.pause();
        cancionFondo.currentTime = 0;
        document.getElementById('btn-disparo').classList.remove('visible');
        document.getElementById('soundboard-guia').classList.remove('visible');
        estado.textContent = 'reiniciado, esperando eventos...';
        return;
      }

      if (evento === 'acto3_disparo_arma') {
        loopPersecucion.pause();
        loopPersecucion.currentTime = 0;
        cancionFondo.pause();
        cancionFondo.currentTime = 0;
        document.getElementById('btn-disparo').classList.remove('visible');
        estado.textContent = 'esperando el final...';
        setTimeout(() => {
          ultimoEventoReproducido = 'acto3_final';
          audio.src = 'audios/acto3_final.mp3';
          audio.play().catch(err => console.error("No se pudo reproducir:", err));
        }, DURACION_VIDEO_DESTRUIDA_MS);
        return;
      }

      estado.textContent = `reproduciendo: ${evento}`;
      ultimoEventoReproducido = evento;
      audio.src = `audios/${evento}.mp3`;
      audio.play().catch(err => console.error("No se pudo reproducir:", err));

      if (evento === 'acto1_guia_inicio') {
        document.getElementById('soundboard-guia').classList.add('visible');
      }

      if (evento === 'acto1_hacha_obtenida') {
        document.getElementById('soundboard-guia').classList.remove('visible');
      }

      if (evento === 'acto3_arma_lista') {
        loopPersecucion.src = 'audios/acto3_bruno_voy_por_ti.mp3';
        loopPersecucion.play().catch(() => {});
        cancionFondo.src = 'audios/cancion-atacando.mp3';
        cancionFondo.volume = 0.4;
        cancionFondo.play().catch(() => {});
        document.getElementById('btn-disparo').classList.add('visible');
      }
    });
  });
</script>
</body>
</html>
