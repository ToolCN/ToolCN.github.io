<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verity - Voz</title>
<style>
  body {
    background: #000;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  button {
    padding: 24px 48px;
    font-size: 1.3rem;
    border-radius: 12px;
    border: none;
    background: #444;
    color: white;
  }
  #estado {
    position: fixed;
    bottom: 10px;
    font-size: 0.8rem;
    color: #555;
  }
  #img-verity {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 20;
    display: none;
  }
</style>
</head>
<body>

<button id="btnIniciar">Toca para iniciar (conecta primero la bocina bluetooth)</button>
<audio id="reproductor"></audio>
<img id="img-verity" alt="Verity">
<div id="estado">esperando...</div>

<script src="polling.js"></script>
<script>
  const boton = document.getElementById('btnIniciar');
  const audio = document.getElementById('reproductor');
  const estado = document.getElementById('estado');

  const imgVerity = document.getElementById('img-verity');

  // Antes de que empiece cualquier noche, la cara "por defecto" es la de la Noche 1
  let imagenVerityActual = 'imagenes/verity-noche1.png';

  const EVENTOS_CAMBIO_IMAGEN = {
    "acto1_inicio": "imagenes/verity-noche1.png",
    "acto2_inicio": "imagenes/verity-noche2.png",
    "acto3_inicio": "imagenes/verity-noche3.png"
  };

  // En estos eventos NO se muestra la imagen (son las reacciones
  // rápidas de trivia, muy seguidas entre sí — se vería mal parpadeando)
  const EVENTOS_SIN_IMAGEN = ["acto1_trivia_correcto", "acto1_trivia_incorrecto"];

  audio.addEventListener('ended', () => {
    imgVerity.style.display = 'none';
  });

  boton.addEventListener('click', () => {
    audio.src = "audios/silencio.mp3";
    audio.play().catch(() => {});

    boton.style.display = 'none';
    estado.textContent = 'conectado, esperando eventos...';

    iniciarSondeo((evento) => {
      if (EVENTOS_CAMBIO_IMAGEN[evento]) {
        imagenVerityActual = EVENTOS_CAMBIO_IMAGEN[evento];
      }

      estado.textContent = `reproduciendo: ${evento}`;
      audio.src = `audios/${evento}.mp3`;

      if (!EVENTOS_SIN_IMAGEN.includes(evento)) {
        imgVerity.src = imagenVerityActual;
        imgVerity.style.display = 'block';
      }

      audio.play().catch(err => console.error("No se pudo reproducir:", err));
    });
  });
</script>
</body>
</html>
